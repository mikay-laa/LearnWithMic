<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LearnWithMic - Study SMART, Not HARD</title>
  
  <style>
    /* Google Fonts matching reference typography */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400&family=Alex+Brush&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fdf3f7;
      color: #6b2144;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Soft Grid Notebook Background Pattern */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(244, 114, 182, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(244, 114, 182, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: -2;
    }

    /* Shimmering Pink Glitter Background Overlay */
    .pink-glitter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #f472b6, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fbcfe8, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 90px 40px, #ec4899, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #f472b6, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #fbcfe8, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 310px 80px, #ec4899, rgba(0,0,0,0));
      background-size: 300px 300px;
      opacity: 0.6;
      animation: glitterShimmer 4s linear infinite alternate;
    }

    @keyframes glitterShimmer {
      0% { opacity: 0.35; transform: translateY(0); }
      100% { opacity: 0.75; transform: translateY(-8px); }
    }

    /* Floating Butterflies and Flowers */
    .floating-element {
      position: fixed;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      opacity: 0.9;
      filter: drop-shadow(0 4px 8px rgba(244, 114, 182, 0.35));
    }

    .butterfly-1 { top: 18%; left: 5%; font-size: 2.5rem; animation: floatButterfly 7s ease-in-out infinite; }
    .butterfly-2 { bottom: 18%; right: 5%; font-size: 2.3rem; animation: floatButterfly 8s ease-in-out infinite 1.5s; }
    .flower-1 { top: 22%; right: 6%; font-size: 2.2rem; animation: floatFlower 6s ease-in-out infinite 0.5s; }
    .flower-2 { bottom: 22%; left: 6%; font-size: 2.1rem; animation: floatFlower 7.5s ease-in-out infinite 1s; }

    @keyframes floatButterfly {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-16px) rotate(12deg) scale(1.05); }
    }

    @keyframes floatFlower {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(-8deg); }
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(253, 243, 247, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(244, 114, 182, 0.2);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: #f472b6;
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
    }

    .brand-name {
      color: #61183c;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    nav a {
      color: #61183c;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      position: relative;
      padding-bottom: 4px;
    }

    nav a:hover, nav a.active {
      color: #ec4899;
    }

    nav a.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #f472b6;
      border-radius: 2px;
    }

    /* Main Container */
    .hero-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      z-index: 2;
    }

    /* Main Natural Card exact layout from reference */
    .journal-card {
      background: #fffafa;
      border: 1.5px solid rgba(244, 114, 182, 0.35);
      border-radius: 28px;
      padding: 55px 45px;
      max-width: 860px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 20px 40px rgba(244, 114, 182, 0.12),
        0 2px 6px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    }

    /* Corner Soft Pink Glows inside the Card */
    .journal-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(251, 113, 133, 0.18);
      filter: blur(40px);
      pointer-events: none;
    }

    .journal-card::after {
      content: '';
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.22);
      filter: blur(45px);
      pointer-events: none;
    }

    /* Top Pill Badge */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid rgba(244, 114, 182, 0.4);
      padding: 6px 20px;
      border-radius: 25px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #e11d48;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(244, 114, 182, 0.1);
    }

    /* Main Title - Serif Bold */
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 4.2rem;
      font-weight: 800;
      color: #581c38;
      letter-spacing: -1px;
      margin-bottom: 2px;
      line-height: 1.1;
    }

    /* Cursive Tagline */
    .cursive-tagline {
      font-family: 'Alex Brush', cursive;
      font-size: 2.4rem;
      color: #f43f5e;
      margin-bottom: 30px;
      font-weight: 400;
    }

    /* Quote Pill Box */
    .quote-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(244, 114, 182, 0.35);
      border-radius: 18px;
      padding: 18px 28px;
      max-width: 680px;
      margin: 0 auto 35px auto;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.06);
    }

    .quote-text {
      font-size: 0.98rem;
      font-style: italic;
      color: #701a38;
      line-height: 1.6;
      font-weight: 500;
    }

    /* Solid Pink Pill Button */
    .btn-watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ff65a3;
      color: #ffffff;
      padding: 14px 34px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 101, 163, 0.4);
      transition: all 0.25 ease;
      text-decoration: none;
    }

    .btn-watch:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 101, 163, 0.55);
      background: #f43f5e;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid #ffffff;
      display: inline-block;
      margin-left: 2px;
    }

    /* Video Pop-up Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(88, 28, 56, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 800px;
      background: #ffffff;
      border: 2px solid #f472b6;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      color: #581c38;
      cursor: pointer;
      z-index: 1001;
      font-weight: bold;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="pink-glitter-overlay"></div>

  <!-- Animated Floating Elements -->
  <div class="floating-element butterfly-1">🦋</div>
  <div class="floating-element butterfly-2">🦋</div>
  <div class="floating-element flower-1">🌸</div>
  <div class="floating-element flower-2">🌺</div>

  <!-- Header Section -->
  <header>
    <a href="#" class="brand">
      <div class="brand-logo">LWM</div>
      <span class="brand-name">LearnWithMic</span>
    </a>

    <nav>
      <ul>
        <li><a href="#" class="active" onclick="switchTab(this, 'Home')">Home</a></li>
        <li><a href="#" onclick="switchTab(this, 'Videos')">Videos</a></li>
        <li><a href="#" onclick="switchTab(this, 'Ed Tools')">Ed Tools</a></li>
        <li><a href="#" onclick="switchTab(this, 'My Journey')">My Journey</a></li>
      </ul>
    </nav>
  </header>

  <!-- Front Page Layout matching reference image -->
  <main class="hero-container">
    <div class="journal-card">
      
      <!-- Top Pill Badge -->
      <div class="badge-pill">
        🍒 WELCOME TO MY WORLD
      </div>

      <!-- Main Title -->
      <h1 class="main-title">LearnWithMic</h1>

      <!-- Cursive Subtitle Tagline -->
      <p class="cursive-tagline">"Study SMART. Not HARD. Keep learning."</p>

      <!-- Pill Quote Box -->
      <div class="quote-box">
        <p class="quote-text">
          "Heyoo! Welcome to LearnWithMic, a collection of my journeys, learnings, and little moments that I want to cherish and look back on someday." 🌸 ✨
        </p>
      </div>

      <!-- Solid Pink Pill CTA Button -->
      <button class="btn-watch" onclick="openVideoModal()">
        WATCH THE VIDEO 🎀 <span class="play-triangle"></span>
      </button>

    </div>
  </main>

  <!-- Video Modal -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeVideoModal()">&times;</span>
      <div class="video-container">
        <iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    function switchTab(element, tabName) {
      document.querySelectorAll('nav a').forEach(link => link.classList.remove('active'));
      element.classList.add('active');
    }

    const modal = document.getElementById('videoModal');
    const iframe = document.getElementById('videoIframe');
    const videoUrl = "https://drive.google.com/file/d/10Ral6GUJEfOjCfJt8tfbZHsh51iN_EEi/preview";

    function openVideoModal() {
      iframe.src = videoUrl;
      modal.style.display = 'flex';
    }

    function closeVideoModal() {
      iframe.src = "";
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        closeVideoModal();
      }
    };
  </script>
</body>
</html>
