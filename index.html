<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LearnWithMic - Study SMART, Not HARD</title>
  
  <style>
    /* Modern, Clean Typography */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #fdf2f8;
      color: #6b2144;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Soft Grid Notebook Background Pattern */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(244, 114, 182, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(244, 114, 182, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: -2;
    }

    /* Shimmering Pink Glitter Background Overlay */
    .pink-glitter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #f472b6, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fbcfe8, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ec4899, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #f472b6, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #fbcfe8, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 310px 80px, #ec4899, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 350px 350px;
      opacity: 0.6;
      animation: glitterShimmer 4s linear infinite alternate;
    }

    @keyframes glitterShimmer {
      0% { opacity: 0.4; transform: translateY(0); }
      100% { opacity: 0.8; transform: translateY(-10px); }
    }

    /* Floating Pink Butterflies and Flowers */
    .floating-element {
      position: fixed;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
      filter: drop-shadow(0 4px 8px rgba(244, 114, 182, 0.3));
    }

    .butterfly-1 { top: 15%; left: 6%; font-size: 2.4rem; animation: floatButterfly 7s ease-in-out infinite; }
    .butterfly-2 { bottom: 20%; right: 7%; font-size: 2.2rem; animation: floatButterfly 8s ease-in-out infinite 1.5s; }
    .flower-1 { top: 22%; right: 8%; font-size: 2.2rem; animation: floatFlower 6s ease-in-out infinite 0.5s; }
    .flower-2 { bottom: 18%; left: 8%; font-size: 2rem; animation: floatFlower 7.5s ease-in-out infinite 1s; }
    .sparkle-pink { top: 10%; left: 45%; font-size: 1.8rem; animation: floatFlower 5s ease-in-out infinite 2s; }

    @keyframes floatButterfly {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-18px) rotate(12deg) scale(1.05); }
    }

    @keyframes floatFlower {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(-8deg); }
    }

    /* Header & Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(253, 242, 248, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(244, 114, 182, 0.25);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: #f472b6;
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
    }

    .brand-name {
      color: #831843;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    nav a {
      color: #831843;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      position: relative;
      padding-bottom: 4px;
    }

    nav a:hover, nav a.active {
      color: #db2777;
    }

    nav a.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #f472b6;
      border-radius: 2px;
    }

    /* Main Container */
    .hero-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      z-index: 2;
    }

    /* Natural Handcrafted Journal Card */
    .journal-card {
      background: radial-gradient(circle at 20% 30%, rgba(255, 245, 249, 0.98) 0%, rgba(255, 230, 240, 0.95) 100%);
      border: 2px solid #f472b6;
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 780px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 15px 35px rgba(244, 114, 182, 0.18),
        inset 0 0 30px rgba(244, 114, 182, 0.12);
      position: relative;
      transform: rotate(-0.2deg);
    }

    /* Decorative Washi Tape Accent */
    .journal-card::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 26px;
      background: rgba(251, 207, 232, 0.85);
      border: 1px dashed rgba(244, 114, 182, 0.5);
      border-radius: 2px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fdf2f8;
      border: 1px solid #f472b6;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #9d174d;
      margin-bottom: 22px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #ec4899;
      border-radius: 50%;
    }

    .title {
      font-size: 3.8rem;
      font-weight: 800;
      color: #831843;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
      animation: floatTitle 3s ease-in-out infinite;
    }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .subtitle {
      font-size: 1.4rem;
      color: #db2777;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .description {
      font-size: 1.05rem;
      color: #6b2144;
      max-width: 580px;
      line-height: 1.75;
      margin: 0 auto 35px auto;
    }

    .highlight {
      color: #be185d;
      font-weight: 700;
      background: #fbcfe8;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Action Button */
    .btn-watch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f472b6;
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 28px;
      font-weight: 700;
      font-size: 0.98rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-watch:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
      background: #ec4899;
    }

    .play-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Modal Overlay & Pop-up Video */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(131, 24, 67, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 800px;
      background: #ffffff;
      border: 2px solid #f472b6;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      color: #831843;
      cursor: pointer;
      z-index: 1001;
      font-weight: bold;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="pink-glitter-overlay"></div>

  <!-- Animated Pink Butterflies & Flowers -->
  <div class="floating-element butterfly-1">🦋</div>
  <div class="floating-element butterfly-2">🦋</div>
  <div class="floating-element flower-1">🌸</div>
  <div class="floating-element flower-2">🌺</div>
  <div class="floating-element sparkle-pink">✨</div>

  <!-- Header Section -->
  <header>
    <a href="#" class="brand">
      <div class="brand-logo">LWM</div>
      <span class="brand-name">LearnWithMic</span>
    </a>

    <nav>
      <ul>
        <li><a href="#" class="active" onclick="switchTab(this, 'Home')">Home</a></li>
        <li><a href="#" onclick="switchTab(this, 'Videos')">Videos</a></li>
        <li><a href="#" onclick="switchTab(this, 'Ed Tools')">Ed Tools</a></li>
        <li><a href="#" onclick="switchTab(this, 'My Journey')">My Journey</a></li>
      </ul>
    </nav>
  </header>

  <!-- Coquette Study Journal Hero -->
  <main class="hero-container">
    <div class="journal-card">
      <div class="badge">
        <span class="badge-dot"></span>
        Digital Learning & Smart Study Tips
      </div>

      <h1 class="title">LearnWithMic</h1>
      <h2 class="subtitle">Study SMART, not HARD 🌸</h2>

      <p class="description">
        Welcome! Here I document my learning journey, share useful <span class="highlight">educational tools</span>, and help students discover better, <span class="highlight">stress-free ways to learn</span>.
      </p>

      <button class="btn-watch" onclick="openVideoModal()">
        WATCH THE VIDEO 🎀
        <svg class="play-icon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- Video Pop-up Modal -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeVideoModal()">&times;</span>
      <div class="video-container">
        <iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    function switchTab(element, tabName) {
      document.querySelectorAll('nav a').forEach(link => link.classList.remove('active'));
      element.classList.add('active');
    }

    const modal = document.getElementById('videoModal');
    const iframe = document.getElementById('videoIframe');
    const videoUrl = "https://drive.google.com/file/d/10Ral6GUJEfOjCfJt8tfbZHsh51iN_EEi/preview";

    function openVideoModal() {
      iframe.src = videoUrl;
      modal.style.display = 'flex';
    }

    function closeVideoModal() {
      iframe.src = "";
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        closeVideoModal();
      }
    };
  </script>
</body>
</html>
